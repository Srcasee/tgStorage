services:
  telegram-drive:
    container_name: telegram-drive
    image: tgstorage:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/data
    env_file:
      - .env
    ports:
      - "8080:8000"
    networks:
      - telegram-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: telegram-drive-proxy
    restart: unless-stopped
    profiles:
      - proxy
    volumes:
      - ./sing-box/config.json:/etc/sing-box/config.json:ro
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    networks:
      telegram-net:
        aliases:
          - proxy

networks:
  telegram-net:
    driver: bridge
