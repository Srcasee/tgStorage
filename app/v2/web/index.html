<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tgStorage</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: .7rem; }
    button { padding: .7rem 1rem; cursor: pointer; }
    .resource { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: .6rem 0; }
    .meta { color: #666; font-size: .9rem; margin-top: .35rem; }
  </style>
</head>
<body>
  <h1>tgStorage</h1>
  <form id="search-form">
    <input id="query" name="q" placeholder="搜索文件名…" autocomplete="off">
    <button type="submit">搜索</button>
  </form>
  <div id="status"></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById('search-form');
    const query = document.getElementById('query');
    const results = document.getElementById('results');
    const status = document.getElementById('status');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function search(q = '') {
      status.textContent = '搜索中…';
      results.replaceChildren();
      const response = await fetch('/api/v2/resources/search?q=' + encodeURIComponent(q));
      if (!response.ok) throw new Error('搜索失败: HTTP ' + response.status);
      const resources = await response.json();
      status.textContent = resources.length ? `找到 ${resources.length} 个资源` : '没有找到资源';
      for (const item of resources) {
        const node = document.createElement('div');
        node.className = 'resource';
        node.innerHTML = `
          <strong>${escapeHtml(item.filename || '(未命名)')}</strong>
          <div class="meta">${escapeHtml(item.resource_type)} · ${escapeHtml(item.mime_type)} · ${Number(item.size || 0).toLocaleString()} bytes</div>
          <p><a href="/api/v2/resources/${encodeURIComponent(item.id)}/download">下载</a></p>
        `;
        results.appendChild(node);
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      try { await search(query.value.trim()); }
      catch (error) { status.textContent = error.message; }
    });

    search().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
