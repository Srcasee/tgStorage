<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tgStorage Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>tgStorage Admin</h1>

    <section>
      <h2>Accounts</h2>
      <input id="account-name" placeholder="name" />
      <input id="account-session" placeholder="session_path" />
      <button onclick="createAccount()">Create</button>
      <button onclick="loadAccounts()">Refresh</button>
      <pre id="accounts">loading...</pre>
    </section>

    <section>
      <h2>Sources</h2>
      <input id="source-account" placeholder="account_id" />
      <input id="source-chat" placeholder="chat_id" />
      <input id="source-title" placeholder="title" />
      <button onclick="createSource()">Create</button>
      <button onclick="loadSources()">Refresh</button>
      <pre id="sources">loading...</pre>
    </section>

    <section>
      <h2>Resources</h2>
      <button onclick="loadResources()">Refresh</button>
      <pre id="resources">loading...</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
