<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<title>Telegram Drive</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

input {
    width: 300px;
    padding: 8px;
}

button {
    padding: 6px 12px;
    margin: 5px;
    cursor: pointer;
}

.card {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
}

.name {
    font-weight: bold;
    margin-bottom: 8px;
}

.info {
    color: #666;
    margin-bottom: 10px;
}

video {
    margin-top: 10px;
    max-width: 800px;
}

.video-box {
    margin-top: 10px;
}

</style>

</head>


<body>


<h2>
Telegram Drive
</h2>


<input
id="search"
placeholder="搜索文件"
/>


<button onclick="searchFiles()">
搜索
</button>


<button onclick="loadFiles()">
刷新
</button>


<div id="files"></div>



<script>


async function loadFiles(){


    let res =
        await fetch(
            "/files?page=1&size=50"
        );


    let data =
        await res.json();


    renderFiles(
        data.data?.items || []
    );

}



async function searchFiles(){


    let q =
        document.getElementById(
            "search"
        ).value.trim();


    if(!q){

        loadFiles();

        return;

    }


    let res =
        await fetch(
            "/files/search?q="
            +
            encodeURIComponent(q)
        );


    let data =
        await res.json();


    renderFiles(
        data.data?.items || data
    );

}



function renderFiles(files){


    let box =
        document.getElementById(
            "files"
        );


    box.innerHTML = "";


    for(
        let f of files
    ){


        let size =
            (
                f.size
                /
                1024
                /
                1024
            )
            .toFixed(2)
            +
            " MB";



        let card =
        document.createElement(
            "div"
        );


        card.className =
            "card";



        let html = `


<div class="name">
${f.filename}
</div>


<div class="info">
${size}
|
${f.mime_type}
</div>


<a href="/files/${f.id}/download">

<button>
下载
</button>

</a>


`;



        if(
            f.mime_type &&
            f.mime_type.startsWith(
                "video"
            )
        ){

            html += `

<button
onclick="playVideo(this, ${f.id}, '${f.mime_type}')">

播放

</button>


<div class="video-box"></div>

`;

        }



        card.innerHTML =
            html;


        box.appendChild(
            card
        );


    }


}




function playVideo(
    btn,
    id,
    mime
){


    let box =
        btn.parentElement.querySelector(
            ".video-box"
        );


    if(
        box.querySelector("video")
    ){

        return;

    }



    let video =
        document.createElement(
            "video"
        );


    video.controls =
        true;


    video.playsInline =
        true;


    video.preload =
        "metadata";


    video.src =
        "/files/"
        +
        id
        +
        "/stream";



    video.type =
        mime;


    box.appendChild(
        video
    );


    video.play()
    .catch(
        ()=>{}
    );


}



loadFiles();


</script>


</body>

</html>
